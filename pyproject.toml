[project]
name = "aiida-mcp"
version = "0.1.0"
description = "Project-scoped AiiDA MCP plugin backend and Manager control plane."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.129.0",
    "fastmcp>=3.0,<4",
    "pydantic>=2.10",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28.0"]

[project.scripts]
aiida-mcp = "aiida_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiida_mcp"]

