<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AiiDA MCP Console</title>
<style>body{margin:0;background:#111518;color:#edf2f3;font:14px system-ui;display:grid;grid-template-columns:280px 1fr;min-height:100vh}aside{padding:24px;border-right:1px solid #2b363c;background:#161c20}main{padding:28px;max-width:1000px}h1{margin-top:0}button,input{font:inherit;padding:8px;border:1px solid #40515a;border-radius:3px;background:#1a2227;color:#edf2f3}button{cursor:pointer}.primary{background:#78c8ee;color:#07141a;border-color:#78c8ee}#projects button{display:block;width:100%;text-align:left;margin:6px 0}.muted{color:#98a7ac}.card{padding:18px;background:#161c20;border:1px solid #2b363c;margin:14px 0;white-space:pre-wrap}form{display:grid;gap:8px;margin-top:22px}label{display:grid;gap:4px}.error{color:#fc9191}</style>
<aside><h1>AiiDA MCP</h1><p class="muted">Project-scoped AiiDA console</p><div id="projects"></div><form id="create"><h3>Bind existing Group</h3><label>Name<input name="name" required></label><label>Profile<input name="aiida_profile" required></label><label>Project Python<input name="python_interpreter_path" required></label><label>Group UUID<input name="group_uuid" required></label><label>Group label (display only)<input name="group_label"></label><button class="primary">Create project</button></form></aside>
<main><h1 id="title">Choose an AiiDA project</h1><p id="message" class="muted">Every request is constrained by the selected Group UUID.</p><div id="status"></div><div id="processes"></div></main>
<script>
const $=s=>document.querySelector(s);let projects=[];const api=async(p,o={})=>{const r=await fetch(p,{headers:{'content-type':'application/json'},...o});const b=await r.json();if(!r.ok)throw Error(b.detail?.message||b.detail||r.statusText);return b};
function showError(e){$('#message').className='error';$('#message').textContent=e.message}function renderList(){ $('#projects').innerHTML='<h3>Projects</h3>'+projects.map(p=>`<button onclick="openProject('${p.project_ref}')">${p.name}<br><small>${p.group_label||p.group_uuid}</small></button>`).join('')||'<p class="muted">No projects bound.</p>'}
async function openProject(ref){try{const [status,processes]=await Promise.all([api(`/api/projects/${ref}/status`),api(`/api/projects/${ref}/processes`)]);$('#title').textContent=status.project.name;$('#message').className='muted';$('#message').textContent=`Group UUID: ${status.project.group_uuid}`;$('#status').innerHTML=`<div class="card">Worker: ${status.status||'online'} · Profile: ${status.profile||status.project.aiida_profile}</div>`;$('#processes').innerHTML='<h2>Recent processes</h2><div class="card">'+(processes.items||[]).map(x=>`${x.pk} · ${x.process_label||x.label} · ${x.state||x.process_state||'unknown'}`).join('\n')||'No processes in this project Group.'+'</div>'}catch(e){showError(e)}}
async function load(){try{projects=(await api('/api/projects')).items||[];renderList()}catch(e){showError(e)}}$('#create').onsubmit=async e=>{e.preventDefault();try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();await load();openProject(p.project_ref)}catch(e){showError(e)}};load();
</script></html>
