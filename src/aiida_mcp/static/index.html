<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AiiDA Manager</title>
<style>
:root{--ink:#202123;--muted:#74757b;--soft:#f7f7f8;--accent:#10a37f}*{box-sizing:border-box}body{margin:0;min-width:760px;color:var(--ink);background:#fff;font:15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;background:transparent;color:inherit;cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{position:fixed;inset:0 auto 0 0;width:264px;padding:18px 12px;background:var(--soft);display:flex;flex-direction:column}.brand{padding:8px 10px 27px;font-size:20px;font-weight:650;letter-spacing:-.35px;display:flex;gap:10px;align-items:center}.logo{width:22px;height:22px;background:linear-gradient(90deg,#202123 0 45%,transparent 45% 55%,#202123 55%);clip-path:polygon(0 28%,45% 28%,45% 0,100% 0,100% 70%,55% 70%,55% 100%,0 100%)}.new-project{background:#fff;width:100%;padding:11px 12px;border-radius:11px;text-align:left;box-shadow:0 1px 2px #00000010}.new-project b{font-size:20px;font-weight:300;margin-right:9px;color:var(--muted)}.side-title{margin:29px 10px 8px;color:#929399;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}#projectList{display:grid;gap:3px}.project,.all-db{width:100%;padding:10px;border-radius:9px;text-align:left;color:#55575c}.project:hover,.all-db:hover{background:#eee}.project.active{background:#e9e9eb;color:#202123;font-weight:600}.dot{display:inline-block;width:8px;height:8px;margin-right:10px;border-radius:50%;background:#c8c9cd}.active .dot{background:var(--accent)}.all-db{margin-top:14px}.side-footer{margin-top:auto;padding:10px;color:#929399;font-size:12px}.workspace{width:100%;min-height:100vh;margin-left:264px;padding:30px clamp(40px,7vw,110px) 80px}.topbar,main{max-width:980px;margin-left:auto;margin-right:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:46px}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:4px}h1{margin:0;font-size:30px;letter-spacing:-.8px}.actions{display:flex;gap:9px;align-items:center}.status{padding:8px 11px;border-radius:99px;background:var(--soft);color:#5d5f64;font-size:13px}.status-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#c7c8cc}.status.online .status-dot{background:var(--accent)}.refresh{padding:9px 13px;border-radius:9px;background:var(--soft)}.refresh:hover{background:#ededee}.welcome{max-width:580px;margin:17vh auto;text-align:center}.welcome h2{font-size:28px;letter-spacing:-.7px;margin:0 0 12px}.welcome p,.empty,.database p{color:var(--muted);line-height:1.6}.primary{padding:10px 15px;border-radius:10px;background:#202123;color:#fff}.project-intro{margin-bottom:34px}.project-intro h2{margin:0 0 9px;font-size:24px;letter-spacing:-.55px}.chip{display:inline-block;max-width:100%;padding:6px 10px;border-radius:8px;background:var(--soft);color:#65676c;font-size:12px;overflow-wrap:anywhere}.summary{display:flex;gap:10px;margin-bottom:38px}.metric{min-width:120px;padding:13px 15px;border-radius:12px;background:var(--soft)}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin-top:4px}.section-heading{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 13px}.section-heading h2{font-size:18px;margin:0}.section-heading span{color:var(--muted);font-size:13px}.activity{display:grid;gap:7px}.activity-item{width:100%;padding:14px 16px;border-radius:12px;background:var(--soft);text-align:left;display:flex;justify-content:space-between;gap:14px;align-items:center}.activity-item:hover{background:#ededee}.activity-title{font-weight:600}.activity-meta{display:block;margin-top:3px;color:var(--muted);font-size:13px}.badge{padding:5px 8px;border-radius:99px;background:#e8e8ea;color:#606269;font-size:11px}.inspector{position:fixed;z-index:5;top:12px;right:12px;bottom:12px;width:min(470px,calc(100vw - 292px));padding:24px;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 18px 55px #0002;transform:translateX(calc(100% + 28px));transition:transform .2s}.inspector.open{transform:translateX(0)}.scrim{position:fixed;z-index:4;inset:0;background:#0002;opacity:0;pointer-events:none;transition:.2s}.scrim.open{opacity:1;pointer-events:auto}.inspector-head{display:flex;justify-content:space-between;align-items:center}.inspector-head h2{margin:0}.close{padding:7px;border-radius:8px;color:var(--muted)}.close:hover{background:var(--soft)}.kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-top:24px}.detail-title{font-size:24px;overflow-wrap:anywhere}.detail-value{padding:13px;border-radius:10px;background:var(--soft);white-space:pre-wrap;overflow:auto;font-size:13px;line-height:1.5}dialog{width:min(510px,calc(100vw - 32px));border:0;border-radius:16px;box-shadow:0 18px 55px #0003}dialog::backdrop{background:#0004}.dialog-body{padding:25px}.dialog-body h2{margin:0 0 7px}.hint{color:var(--muted);line-height:1.5;font-size:14px}label{display:block;margin:12px 0;color:#505156;font-size:13px}input{display:block;width:100%;margin-top:6px;padding:11px;border:0;border-radius:9px;background:var(--soft);outline:2px solid transparent}input:focus{background:#fff;outline-color:#a9dfd0}menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:21px 0 0}.cancel{padding:10px 13px;color:var(--muted)}@media(max-width:860px){body{min-width:0}.sidebar{width:220px}.workspace{margin-left:220px;padding:25px}.inspector{width:calc(100vw - 32px)}.summary{flex-wrap:wrap}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><i class="logo"></i>AiiDA Manager</div><button class="new-project" id="newProject"><b>+</b>New project</button><div class="side-title">Projects</div><div id="projectList"></div><button class="all-db" id="allDatabase">All database</button><div class="side-footer">Local AiiDA workspace</div></aside><section class="workspace"><header class="topbar"><div><div class="eyebrow">AiiDA workspace</div><h1 id="pageTitle">Projects</h1></div><div class="actions"><span class="status" id="workerStatus"><i class="status-dot"></i><span>Connecting</span></span><button class="refresh" id="refresh">Refresh</button></div></header><main id="content"><div class="empty">Loading your local projects…</div></main></section></div>
<div class="scrim" id="scrim"></div><aside class="inspector" id="inspector"><div class="inspector-head"><h2>Details</h2><button class="close" id="closeInspector">Close</button></div><div id="detail"></div></aside>
<dialog id="projectDialog"><form method="dialog" class="dialog-body"><h2>Bind AiiDA project</h2><p class="hint">Connect this Manager project to an existing AiiDA Group. Its UUID keeps the scope stable if its label changes.</p><label>Project name<input name="name" required autofocus maxlength="120"></label><label>AiiDA profile<input name="aiida_profile" required maxlength="120" placeholder="e.g. dev"></label><label>Project folder<input name="workspace_path" required maxlength="1000" placeholder="/home/user/project/silicon-test"></label><label>Project Python<input name="python_interpreter_path" required maxlength="500" placeholder="/home/user/project/silicon-test/.venv/bin/python"></label><label>AiiDA Group UUID<input name="group_uuid" required maxlength="120"></label><label>Group label <small>(optional)</small><input name="group_label" maxlength="240"></label><menu><button class="cancel" value="cancel">Cancel</button><button class="primary" value="create">Bind project</button></menu></form></dialog>
<script>
const state={projects:[],selectedProject:null,processes:[],nodes:[],health:null,view:'project'};const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b.detail?.message||b.detail||r.statusText)}return r.json()}const selected=()=>state.projects.find(p=>p.id===state.selectedProject)||null,scope=()=>selected()?.project_ref||null,query=()=>scope()?`?group_label=${encodeURIComponent(scope())}`:'';
function projects(){const current=selected();$('#projectList').innerHTML=state.projects.length?state.projects.map(p=>`<button class="project ${p.id===current?.id?'active':''}" onclick="window.selectProject('${esc(p.id)}')"><i class="dot"></i>${esc(p.name)}</button>`).join(''):'<div class="empty">No projects yet</div>'}function title(x){return x.process_label||x.label||x.process_type||x.node_type||`Record ${x.pk||''}`}function records(items,type){return items.map(x=>{const id=x.pk??x.uuid??'',meta=[x.ctime,x.process_state||x.state,x.node_type].filter(Boolean).join(' · ');return `<button class="activity-item" onclick="window.openRecord('${type}','${esc(id)}')"><span><span class="activity-title">${esc(title(x))}</span><span class="activity-meta">${esc(meta||'AiiDA record')}</span></span><span class="badge">${esc(type==='process'?(x.process_state||x.state||'calculation'):'node')}</span></button>`}).join('')}
function render(){projects();const p=selected();if(state.view==='database'){$('#pageTitle').textContent='All database';$('#content').innerHTML='<section class="database"><h2>AiiDA database</h2><p>Select a project from the sidebar to inspect records through its immutable Group UUID.</p></section>';return}if(!p){$('#pageTitle').textContent='Projects';$('#content').innerHTML='<div class="welcome"><h2>Your AiiDA work, in one place.</h2><p>Bind an existing AiiDA Group to browse its calculations and scientific data without changing the database.</p><button class="primary" onclick="$(\'#projectDialog\').showModal()">Bind a project</button></div>';return}$('#pageTitle').textContent=p.name;const ps=state.processes.slice(0,8),nodes=state.nodes.filter(n=>!state.processes.some(x=>String(x.pk)===String(n.pk))).slice(0,6);$('#content').innerHTML=`<section class="project-intro"><h2>${esc(p.name)}</h2><span class="chip">${esc(p.group_label||p.group_uuid)}</span></section><section class="summary"><div class="metric"><span>Calculations</span><strong>${state.processes.length}</strong></div><div class="metric"><span>Nodes</span><strong>${state.nodes.length}</strong></div><div class="metric"><span>Profile</span><strong>${esc(p.aiida_profile)}</strong></div></section><section><div class="section-heading"><h2>Recent activity</h2><span>${state.processes.length?`${state.processes.length} calculations`:'No calculations yet'}</span></div><div class="activity">${ps.length?records(ps,'process'):'<div class="empty">No calculations are in this project yet. Workflows run in this Group will appear here.</div>'}</div></section>${nodes.length?`<section style="margin-top:32px"><div class="section-heading"><h2>Other nodes</h2></div><div class="activity">${records(nodes,'node')}</div></section>`:''}`}
function status(){const el=$('#workerStatus'),text=el.querySelector('span');if(state.health?.status==='online'){el.classList.add('online');text.textContent=`${state.health.profile||selected()?.aiida_profile||'AiiDA'} ready`}else{el.classList.remove('online');text.textContent=state.health?'Worker unavailable':'Connecting'}}async function loadSelected(){const p=selected();if(!p){state.processes=[];state.nodes=[];state.health=null;status();render();return}const q=query(),[health,processes,nodes]=await Promise.all([api(`/api/projects/${encodeURIComponent(p.project_ref)}/status`),api(`/api/processes${q}`),api(`/api/nodes${q}`)]);state.health=health;state.processes=processes.items||[];state.nodes=nodes.items||[];status();render()}async function load(){try{const data=await api('/api/projects');state.projects=data.items||[];if(!state.projects.some(p=>p.id===state.selectedProject))state.selectedProject=localStorage.getItem('aiida-manager-project')||state.projects[0]?.id||null;await loadSelected()}catch(e){$('#content').innerHTML=`<div class="welcome"><h2>Could not reach AiiDA</h2><p>${esc(e.message)}</p></div>`;state.health={};status()}}
function close(){ $('#scrim').classList.remove('open');$('#inspector').classList.remove('open')}function inspect(kind,heading,data){$('#detail').innerHTML=`<div class="kind">${esc(kind)}</div><h2 class="detail-title">${esc(heading)}</h2><div class="detail-value">${esc(JSON.stringify(data,null,2))}</div>`;$('#scrim').classList.add('open');$('#inspector').classList.add('open')}window.selectProject=id=>{state.selectedProject=id;state.view='project';localStorage.setItem('aiida-manager-project',id);loadSelected().catch(e=>inspect('Error','Could not load project',{message:e.message}))};window.openRecord=async(type,id)=>{try{const q=query();if(type==='process'){const [detail,logs,workgraph]=await Promise.all([api(`/api/processes/${id}${q}`),api(`/api/processes/${id}/logs${q}`),api(`/api/processes/${id}/workgraph${q}`)]);inspect('Calculation',title(detail.summary||detail),{detail,logs,workgraph})}else{const detail=await api(`/api/nodes/${id}${q}`);inspect('Node',title(detail.summary||detail),detail)}}catch(e){inspect('Error','Could not load record',{message:e.message})}};
$('#newProject').onclick=()=>$('#projectDialog').showModal();$('#allDatabase').onclick=()=>{state.view='database';render()};$('#refresh').onclick=load;$('#closeInspector').onclick=close;$('#scrim').onclick=close;$('#projectDialog').addEventListener('close',async()=>{const form=$('#projectDialog form');if($('#projectDialog').returnValue==='create'&&form.reportValidity()){try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();state.selectedProject=p.id;state.view='project';localStorage.setItem('aiida-manager-project',p.id);await load()}catch(e){alert(e.message)}}});load();
</script></body></html>
